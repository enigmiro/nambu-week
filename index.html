<style>
  :root{
    --navy:#22344a;
    --navy-deep:#141f2c;
    --sat-blue:#4d6f93;
    --sat-blue-bg:#e6edf3;
    --sun-red:#af4327;
    --sun-red-bg:#f6e7e1;
    --paper:#faf7f0;
    --line:#ddd6c6;
    --line-strong:#b6ab93;
    --ink:#1f1c17;
    --ink-soft:#726a58;
    --accent:#af4327;
    --today-glow:#fbedc2;
    --row-hover:#f3efe3;
    --font-serif:'Noto Serif KR', serif;
    --font-sans:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#e9e5d8;
    font-family:var(--font-sans);
    color:var(--ink);
    padding:28px 20px 60px;
  }
  .sheet{
    max-width:1180px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line-strong);
    padding:36px 38px 42px;
    box-shadow:0 1px 3px rgba(31,28,23,.06), 0 18px 46px -30px rgba(31,28,23,.35);
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
  }
  .title-block{
    text-align:center;
    margin:2px 0 6px;
  }
  .school-name{
    display:inline-block;
    font-family:var(--font-serif);
    font-size:36px;
    font-weight:700;
    color:var(--navy-deep);
    letter-spacing:-.2px;
    border:1px dashed transparent;
    padding:4px 12px;
    border-radius:5px;
    cursor:text;
    outline:none;
  }
  .school-name:hover, .school-name:focus{border-color:var(--line-strong); background:#fff;}
  .subtitle{font-size:12.5px; color:var(--ink-soft); letter-spacing:.1px;}

  .data-source-banner{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    background:#fbf1d4; border:1px solid #e3cd8f; color:#5c4a12;
    font-size:13px; padding:10px 14px; border-radius:7px; margin:0 0 10px;
  }
  .data-source-banner.connected{
    background:#e7f2ea; border-color:#a8cdb3; color:#20522f;
  }
  .data-source-banner .btn{padding:4px 11px; font-size:12px;}

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .nav-group{display:flex; align-items:center; gap:6px;}
  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:background .12s, border-color .12s, box-shadow .12s;
    white-space:nowrap;
    touch-action:manipulation;
  }
  .btn:hover{background:var(--row-hover); border-color:var(--ink-soft);}
  .btn:disabled{opacity:.45; cursor:default; pointer-events:none;}
  .btn.primary{background:var(--navy); border-color:var(--navy); color:#fff; box-shadow:0 1px 2px rgba(20,31,44,.25);}
  .btn.primary:hover{background:var(--navy-deep); border-color:var(--navy-deep);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:var(--row-hover);}
  .btn.small{padding:4px 10px; font-size:12px;}
  .btn.danger{color:var(--sun-red);}
  .week-range{font-size:17px; font-weight:700; color:var(--navy-deep); min-width:170px; text-align:center;}
  .action-group{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .dir-status{font-size:11.5px; color:var(--ink-soft);}
  .dir-status.connected{color:#3f8a5c; font-weight:600;}

  /* ---------- Table ---------- */
  .table-scroll-wrap{position:relative;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  /* Fades in on the right edge whenever the table is wider than its container, so it's obvious
     there's more to scroll to (e.g. to reach Saturday/Sunday) rather than looking like it's missing. */
  .table-scroll-wrap.has-overflow::after{
    content:"";
    position:absolute; top:0; right:0; bottom:0; width:26px;
    background:linear-gradient(to right, rgba(238,236,229,0), rgba(238,236,229,.95));
    pointer-events:none;
  }
  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    min-width:920px;
  }
  col.label-col{width:78px;}
  col.weekend-col{width:96px;}

  thead th{
    padding:10px 6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.2px;
    text-align:center;
    background:var(--navy);
    color:#fff;
    border:1px solid var(--paper);
  }
  thead th.dow-label{background:var(--navy-deep); position:sticky; left:0; z-index:3; font-family:var(--font-serif); font-weight:700;}
  thead th.dow-sun{background:var(--sun-red);}
  thead th.dow-sat{background:var(--sat-blue);}

  thead tr.date-row td{
    padding:6px 8px;
    font-size:14px;
    font-weight:700;
    border:1px solid var(--line);
    background:#fff;
    text-align:center;
  }
  thead tr.date-row td.sun-date{color:var(--sun-red);}
  thead tr.date-row td.sat-date{color:var(--sat-blue);}
  thead tr.date-row td.is-today{background:var(--today-glow);}

  tbody tr.cat-row td{
    border:1px solid var(--line);
    vertical-align:top;
    padding:0;
    background:#fff;
  }
  tbody tr.cat-row td.sun-col{background:#fdfaf9;}
  tbody tr.cat-row td.sat-col{background:#f9fafc;}
  tbody tr.cat-row:hover td{background:var(--row-hover);}
  tbody tr.cat-row td.row-label{vertical-align:middle;} /* overrides the general td's vertical-align:top above */

  .row-label{
    padding:10px 6px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    line-height:1.4;
    color:var(--ink);
    background:#f1efe8;
    position:sticky; left:0; z-index:2;
    cursor:text;
    outline:none;
    border:1px solid transparent;
  }
  tbody tr.cat-row:hover .row-label{background:#eae7dd;}
  .row-label.locked{cursor:default;}
  .row-label.locked:focus{background:#f1efe8; border-color:transparent;}
  .row-label:focus{background:#fff; border-color:var(--line-strong);}
  .row-del{
    position:absolute; top:2px; right:2px;
    font-size:10px; line-height:1;
    border:none; background:transparent; color:var(--ink-soft);
    cursor:pointer; padding:2px 4px; border-radius:3px; opacity:0;
    transition:opacity .12s;
  }
  tbody tr.cat-row:hover .row-del{opacity:1;}
  .row-del:hover{color:var(--accent); background:#fff;}

  .day-cell{
    min-height:92px;
    padding:6px 7px 22px;
    position:relative;
    cursor:pointer;
    touch-action:manipulation;
  }
  .entry{
    font-size:12px;
    line-height:1.45;
    margin-bottom:6px;
  }
  .entry .etime{font-weight:700; color:var(--navy-deep);}
  .entry .etitle{font-weight:600;}
  .entry .eloc{display:block; color:var(--ink-soft); padding-left:4px; font-size:11px;}
  .day-cell .add-hint{
    position:absolute; right:6px; bottom:4px;
    font-size:11px; color:var(--line-strong);
    opacity:0; transition:opacity .12s;
  }
  .day-cell:hover{background:#f8f6f0;}
  .day-cell:hover .add-hint{opacity:1; color:var(--navy);}
  body.read-only .day-cell{cursor:default;}
  body.read-only .day-cell:hover{background:none;}
  body.read-only .day-cell .add-hint{display:none;}
  body.read-only .row-label{cursor:default;}
  .day-cell.empty .entry-empty{
    font-size:11px; color:#c9c4b8;
  }

  .add-row-wrap{margin-top:10px;}

  footer.hint{
    margin-top:16px;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  /* ---------- Modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(20,18,15,.42);
    display:none; align-items:center; justify-content:center;
    padding:16px; z-index:50;
  }
  .backdrop.open{display:flex;}
  .modal{
    background:#fff; width:100%; max-width:420px;
    border-radius:8px; padding:20px 22px 18px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    max-height:86vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 2px; font-size:16px;}
  .modal .modal-sub{font-size:12px; color:var(--ink-soft); margin-bottom:14px;}
  .entry-edit{
    border:1px solid var(--line); border-radius:6px;
    padding:10px; margin-bottom:10px; position:relative;
  }
  .entry-edit .fld-row{display:flex; gap:6px; margin-bottom:6px;}
  .entry-edit input{
    font-family:inherit; font-size:16px;
    border:1px solid var(--line-strong); border-radius:4px;
    padding:8px 9px; width:100%;
  }
  .entry-edit input.time-fld{max-width:96px;}
  .entry-edit .remove-entry{
    position:absolute; top:6px; right:6px;
    border:none; background:transparent; color:var(--ink-soft);
    cursor:pointer; font-size:12px;
  }
  .entry-edit .remove-entry:hover{color:var(--accent);}
  .share-wrap{margin-top:8px;}
  .share-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .share-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; border:1px solid var(--line-strong); border-radius:14px;
    padding:4px 10px 4px 8px; cursor:pointer; background:#fff; user-select:none;
  }
  .share-chip input{width:auto; margin:0; accent-color:var(--navy);}
  .share-chip.origin{background:#eef2f7; border-color:var(--navy); color:var(--navy-deep); cursor:default;}
  .modal-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; gap:8px;
  }
  .save-indicator{
    font-size:11.5px; color:#3f8a5c; opacity:0;
    transition:opacity .2s;
  }
  .save-indicator.show{opacity:1;}
  label.fld-label{font-size:10.5px; color:var(--ink-soft); display:block; margin-bottom:2px;}

  @media print{
    @page{ size: landscape; }
    body{background:#fff; padding:0;}
    .sheet{border:none; max-width:none; padding:6px;}
    .toolbar, .add-row-wrap, .row-del, .add-hint, footer.hint, .school-name{cursor:default;}
    .btn, .row-del, .data-source-banner{display:none !important;}
    .table-scroll-wrap.has-overflow::after{display:none;}
  }

  /* ---------- PDF capture mode: hide chrome, keep just the sheet content ---------- */
  body.pdf-capture .toolbar,
  body.pdf-capture footer.hint,
  body.pdf-capture .row-del,
  body.pdf-capture .add-hint,
  body.pdf-capture .data-source-banner{ display:none !important; }
  body.pdf-capture .sheet{ border:none; }
  body.pdf-capture .day-cell.empty{ min-height:70px; }
  body.pdf-capture .table-scroll-wrap.has-overflow::after{ display:none; }

  .pdf-overlay{
    display:none; position:fixed; inset:0; z-index:80;
    background:rgba(20,18,15,.35);
    align-items:center; justify-content:center;
  }
  .pdf-overlay.show{display:flex;}
  .pdf-box{
    background:#fff; padding:16px 26px; border-radius:8px;
    font-size:13px; color:var(--ink); box-shadow:0 12px 30px rgba(0,0,0,.25);
  }

  /* ---------- Touch devices: hover-only affordances need to be always visible ---------- */
  @media (hover:none){
    .row-del{opacity:.55;}
    .day-cell .add-hint{opacity:.5;}
  }

  /* ---------- Mobile ---------- */
  @media (max-width:640px){
    body{padding:14px 8px 40px;}
    .sheet{padding:16px 12px 26px;}
    .topbar{align-items:flex-start;}
    .school-name{font-size:24px;}
    .toolbar{gap:10px 8px;}
    .nav-group{width:100%; justify-content:space-between;}
    .action-group{width:100%; justify-content:flex-start;}
    .btn{padding:9px 12px; font-size:13px;}
    .btn.small{padding:8px 11px; font-size:12.5px;}
    .week-range{min-width:0; flex:1; font-size:14px;}
    thead th{font-size:12px; padding:8px 4px;}
    .day-cell{min-height:76px; padding:8px 6px 22px;}
    .entry{font-size:12.5px;}
    .row-label{font-size:12px; padding:8px 4px;}
    .modal{max-width:100%; width:100%; padding:18px 16px 16px; border-radius:10px;}
    .btn.primary{padding:10px 16px;}
  }
  @media (max-width:400px){
    .school-name{font-size:20px;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="title-block">
    <span class="school-name" id="schoolName" contenteditable="true" spellcheck="false">교육장-국장 주간 일정표</span>
  </div>

  <div class="data-source-banner" id="dataSourceBanner">
    일정표에 접속되지 않았습니다 <button class="btn small primary" id="bannerConnectBtn">일정표 접속</button>
  </div>

  <div class="toolbar">
    <div class="nav-group">
      <button class="btn" id="prevWeek">◀ 이전 주</button>
      <span class="week-range" id="weekRange"></span>
      <button class="btn" id="nextWeek">다음 주 ▶</button>
      <button class="btn ghost" id="gotoToday">오늘</button>
    </div>
    <div class="action-group">
      <button class="btn small primary" id="accessBtn">일정표 접속</button>
      <button class="btn small" id="editModeBtn">편집하기</button>
      <button class="btn small ghost" id="releaseBtn" style="display:none;" title="연결을 끊고 예시 데이터로 돌아갑니다">일정표 해제</button>
      <button class="btn small ghost" id="lockModeBtn" style="display:none;" title="편집을 잠그고 읽기 전용으로 돌아갑니다">편집 잠그기</button>
      <button class="btn small" id="addRowBtn" style="display:none;">+ 행 추가(수정)</button>
      <button class="btn small" id="importBtn" style="display:none;">불러오기</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn small" id="printBtn">인쇄</button>
      <button class="btn small ghost" id="installBtn" style="display:none;">홈 화면에 추가</button>
      <button class="btn small primary" id="exportBtn">내보내기(PDF)</button>
      <button class="btn small primary" id="exportHwpxBtn">내보내기(HWPX)</button>
    </div>
  </div>

  <div class="table-scroll-wrap" id="tableScrollWrap">
    <div class="table-scroll" id="tableScroll">
      <table id="schedTable">
        <colgroup>
          <col class="label-col">
          <col><col><col><col><col>
          <col class="weekend-col">
          <col class="weekend-col">
        </colgroup>
        <thead>
          <tr>
            <th class="dow-label" rowspan="2">구분</th>
            <th>월·MON</th>
            <th>화·TUE</th>
            <th>수·WED</th>
            <th>목·THU</th>
            <th>금·FRI</th>
            <th class="dow-sat">토·SAT</th>
            <th class="dow-sun">일·SUN</th>
          </tr>
          <tr class="date-row" id="dateRow">
            <!-- 7 date cells rendered by JS; rowspan above only works reliably while this
                 row stays inside <thead> alongside it (browsers do not honor rowspan
                 spanning into a separate <tbody>, even though the HTML table model allows it). -->
          </tr>
        </thead>
        <tbody id="tblBody">
          <!-- category rows rendered by JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>
<div id="pdfSpinner" class="pdf-overlay"><div class="pdf-box">PDF 생성 중…</div></div>

<!-- 일정표 접속 (passphrase-based connect; only works once an admin has set up GH_AUTO_CONFIG with an encrypted token) -->
<div class="backdrop" id="passBackdrop">
  <div class="modal" style="max-width:340px;">
    <h3>일정표 접속</h3>
    <div class="modal-sub">관리자가 알려준 암호를 입력하면 저장된 일정표에 연결됩니다.</div>
    <div class="entry-edit">
      <label class="fld-label">암호(passphrase)</label>
      <input type="password" id="autoConnectPass" placeholder="암호 입력">
    </div>
    <label class="share-chip" style="width:100%; justify-content:flex-start; margin-bottom:4px;">
      <input type="checkbox" id="autoConnectRemember">
      이 브라우저에 저장 (다음부터 새로고침해도 자동 접속) — 본인만 쓰는 PC에서만 체크하세요
    </label>
    <div class="modal-footer">
      <button class="btn ghost small" id="autoConnectSkipBtn">취소</button>
      <button class="btn primary small" id="autoConnectGoBtn">접속</button>
    </div>
  </div>
</div>

<!-- 편집하기 (edit-password gate; unlocks editing on top of an already read-only "일정표 접속" session) -->
<div class="backdrop" id="editBackdrop">
  <div class="modal" style="max-width:340px;">
    <h3>편집하기</h3>
    <div class="modal-sub">편집 비밀번호를 입력하면 접속과 편집 잠금 해제가 한 번에 됩니다.</div>
    <div class="entry-edit">
      <label class="fld-label">편집 비밀번호</label>
      <input type="password" id="editPass" placeholder="비밀번호 입력">
    </div>
    <label class="share-chip" style="width:100%; justify-content:flex-start; margin-bottom:4px;">
      <input type="checkbox" id="editRemember">
      이 브라우저에 저장 (다음부터 새로고침해도 자동으로 편집 가능) — 본인만 쓰는 PC에서만 체크하세요
    </label>
    <div class="modal-footer">
      <button class="btn ghost small" id="editPassSkipBtn">취소</button>
      <button class="btn primary small" id="editPassGoBtn">편집 잠금 해제</button>
    </div>
  </div>
</div>

<!-- Cell edit modal -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <h3 id="modalTitle">일정 편집</h3>
    <div class="modal-sub" id="modalSub"></div>
    <div id="entryList"></div>
    <button class="btn small" id="addEntryBtn">+ 항목 추가</button>
    <div class="modal-footer">
      <span class="save-indicator" id="saveIndicator"></span>
      <button class="btn primary small" id="closeModalBtn">저장 및 닫기</button>
    </div>
  </div>
</div>

  // =====================================================================================
  const GH_AUTO_CONFIG = {
    owner: "enigmiro",
    repo: "nambu-week",
    branch: "main",
    path: "data",
    enc: { salt: "", iv: "", data: "" } // ← encrypt.html 결과로 교체
  };

  // =====================================================================================
  // 편집 비밀번호 설정 (관리자 전용, 선택 사항)
  // "편집하기" 버튼은 이 설정 하나로 접속과 편집 잠금 해제를 동시에 처리합니다 — 편집하는
  // 사람은 "일정표 접속"을 따로 누를 필요 없이 이 버튼과 편집 비밀번호만 쓰면 됩니다.
  // encrypt.html 도구에서 "토큰" 칸에 실제 GitHub 토큰을 넣고(위 GH_AUTO_CONFIG와 같은 토큰을
  // 써도 되고, 별도 토큰을 써도 됩니다), 편집 비밀번호로 암호화한 결과를 아래 enc: {...}에
  // 붙여넣으세요. owner/repo/branch/path는 위 GH_AUTO_CONFIG의 값을 그대로 사용합니다.
  // 비워두면 "편집하기" 버튼을 눌러도 아직 설정되지 않았다고 안내됩니다.
  // =====================================================================================
  const EDIT_AUTO_CONFIG = {
    enc: { salt: "", iv: "", data: "" } // ← encrypt.html 결과로 교체 (실제 토큰을 편집 비밀번호로 암호화)
  };

  const DOW = ["월","화","수","목","금","토","일"]; // Mon..Sun columns shown in the grid (index 6 = Sunday, at the end)

  // ---------- state ----------
  let categories = [
    {id:"c1", label:"교육장", locked:true},
    {id:"c2", label:"교육지원국장", locked:true},
    {id:"c3", label:"행정지원국장", locked:true}
  ];
  // Snapshot of the code-defined locked rows — used to override stale labels from an older
  // saved file (e.g. a previous rename in the code shouldn't get silently undone by old data).
  const DEFAULT_LOCKED_CATEGORIES = categories.filter(c=>c.locked).map(c=>({...c}));
  // entries[weekKey][categoryId][dayIndex] = [{id,time,title,loc}, ...]
  let entries = {};
  let weekStart = mondayOf(new Date()); // always starts on the current real week

  let editing = null; // {weekKey, catId, dayIndex}

  // ---------- helpers ----------
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay(); // 0 Sun .. 6 Sat
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    return x;
  }
  function addDays(d, n){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate()+n);
    return x;
  }
  function iso(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function weekDates(start){
    // returns 7 dates for the week: index 0 = Monday ("start"), ... index 6 = Sunday (the day after Saturday).
    const out=[];
    for(let i=0;i<7;i++) out.push(addDays(start,i));
    return out;
  }
  function sameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function dateCellLabel(d){
    return `${d.getMonth()+1}/${d.getDate()}`;
  }
  function uid(){ return 'e'+Math.random().toString(36).slice(2,9); }

  // ---------- time normalization ("0900" -> "09:00") ----------
  function pad2(n){ return String(n).padStart(2,"0"); }
  function normalizeTime(raw){
    const s = String(raw==null ? "" : raw).trim();
    if(s==="") return "";
    let m = /^(\d{1,2}):(\d{2})$/.exec(s);
    if(m){
      const h = parseInt(m[1],10), mi = parseInt(m[2],10);
      if(h>=0 && h<=23 && mi>=0 && mi<=59) return pad2(h)+":"+pad2(mi);
      return s;
    }
    if(/^\d{1,4}$/.test(s)){
      let h, mi;
      if(s.length<=2){ h=parseInt(s,10); mi=0; }
      else if(s.length===3){ h=parseInt(s.slice(0,1),10); mi=parseInt(s.slice(1),10); }
      else { h=parseInt(s.slice(0,2),10); mi=parseInt(s.slice(2),10); }
      if(h>=0 && h<=23 && mi>=0 && mi<=59) return pad2(h)+":"+pad2(mi);
    }
    return s; // not a recognizable time (e.g. free text) — leave as typed
  }

  // ---------- sort entries within a cell by time (no-time entries last) ----------
  function timeMinutes(t){
    const m = /^(\d{2}):(\d{2})$/.exec(t||"");
    return m ? parseInt(m[1],10)*60+parseInt(m[2],10) : null;
  }
  function sortByTime(list){
    return list
      .map((e,i)=>({e,i}))
      .sort((a,b)=>{
        const ta = timeMinutes(a.e.time), tb = timeMinutes(b.e.time);
        if(ta===null && tb===null) return a.i-b.i;
        if(ta===null) return 1;
        if(tb===null) return -1;
        return ta!==tb ? ta-tb : a.i-b.i;
      })
      .map(x=>x.e);
  }

  function ensureWeek(key){
    if(!entries[key]) entries[key] = {};
    categories.forEach(c=>{
      if(!entries[key][c.id]) entries[key][c.id] = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    });
  }

  // ---------- rendering ----------
  const tblBody = document.getElementById("tblBody");
  const dateRowEl = document.getElementById("dateRow");
  const weekRange = document.getElementById("weekRange");
  const tableScroll = document.getElementById("tableScroll");
  const tableScrollWrap = document.getElementById("tableScrollWrap");

  function updateScrollShadow(){
    const overflowing = tableScroll.scrollWidth - tableScroll.clientWidth > 4;
    tableScrollWrap.classList.toggle("has-overflow", overflowing);
  }
  window.addEventListener("resize", updateScrollShadow);
  tableScroll.addEventListener("scroll", ()=>{
    // hide the fade once scrolled close to the end, so it doesn't look stuck
    const atEnd = tableScroll.scrollLeft + tableScroll.clientWidth >= tableScroll.scrollWidth - 4;
    tableScrollWrap.classList.toggle("has-overflow", !atEnd);
  });

  function render(){
    const dates = weekDates(weekStart);
    const key = iso(weekStart);
    ensureWeek(key);
    const today = new Date();

    weekRange.textContent = `${dates[0].getMonth()+1}.${dates[0].getDate()} (월) – ${dates[6].getMonth()+1}.${dates[6].getDate()} (일)`;

    tblBody.innerHTML = "";

    // date row lives in <thead> (see markup) so the "구분" cell's rowspan actually applies —
    // update its cells in place rather than rebuilding a <tr> into <tbody>.
    dateRowEl.innerHTML = "";
    dates.forEach((d,i)=>{
      const td = document.createElement("td");
      td.textContent = dateCellLabel(d);
      if(i===5) td.classList.add("sat-date");
      if(i===6) td.classList.add("sun-date");
      if(sameDay(d,today)) td.classList.add("is-today");
      dateRowEl.appendChild(td);
    });

    // category rows
    categories.forEach(cat=>{
      const tr = document.createElement("tr");
      tr.className = "cat-row";

      const labelTd = document.createElement("td");
      labelTd.className = "row-label" + (cat.locked ? " locked" : "");
      labelTd.contentEditable = (cat.locked || !editUnlocked) ? "false" : "true";
      labelTd.spellcheck = false;
      if(cat.locked && cat.label.endsWith("국장") && cat.label.length>2){
        // wrap "…국장" labels onto two lines (e.g. "교육지원" / "국장") so they read cleanly in a narrow column
        labelTd.innerHTML = `${escapeHtml(cat.label.slice(0,-2))}<br>국장`;
      } else {
        labelTd.textContent = cat.label;
      }
      if(cat.locked){
        labelTd.title = "고정된 항목입니다 (수정 불가)";
      } else {
        labelTd.addEventListener("blur", ()=>{
          cat.label = labelTd.textContent.trim() || cat.label;
        });
        if(editUnlocked){
          const delBtn = document.createElement("button");
          delBtn.className = "row-del";
          delBtn.type = "button";
          delBtn.title = "행 삭제";
          delBtn.textContent = "✕";
          delBtn.addEventListener("click", (e)=>{
            e.stopPropagation();
            if(confirm(`'${cat.label}' 행을 삭제할까요? (해당 행의 모든 일정도 삭제됩니다)`)){
              categories = categories.filter(c=>c.id!==cat.id);
              Object.keys(entries).forEach(wk=>{ delete entries[wk][cat.id]; });
              render();
            }
          });
          labelTd.appendChild(delBtn);
        }
      }
      tr.appendChild(labelTd);

      for(let day=0; day<7; day++){
        const td = document.createElement("td");
        if(day===5) td.classList.add("sat-col");
        if(day===6) td.classList.add("sun-col");
        const cellEntries = sortByTime(entries[key][cat.id][day]);
        const wrap = document.createElement("div");
        wrap.className = "day-cell" + (cellEntries.length===0 ? " empty" : "");
        if(cellEntries.length===0){
          const em = document.createElement("span");
          em.className = "entry-empty";
          em.textContent = "";
          wrap.appendChild(em);
        } else {
          cellEntries.forEach(ent=>{
            const div = document.createElement("div");
            div.className = "entry";
            const line1 = document.createElement("div");
            if(ent.time) line1.innerHTML = `<span class="etime">${escapeHtml(ent.time)}</span> <span class="etitle">${escapeHtml(ent.title)}</span>`;
            else line1.innerHTML = `<span class="etitle">${escapeHtml(ent.title)}</span>`;
            div.appendChild(line1);
            if(ent.loc){
              const line2 = document.createElement("span");
              line2.className = "eloc";
              line2.textContent = "- " + ent.loc;
              div.appendChild(line2);
            }
            wrap.appendChild(div);
          });
        }
        const hint = document.createElement("span");
        hint.className = "add-hint";
        hint.textContent = "+ 편집";
        wrap.appendChild(hint);

        wrap.addEventListener("click", ()=>{ if(editUnlocked) openEditor(key, cat.id, day, cat.label, dates[day]); });
        td.appendChild(wrap);
        tr.appendChild(td);
      }
      tblBody.appendChild(tr);
    });

    updateScrollShadow();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- navigation ----------
  // Only the previous, current, and next week (relative to today, recomputed fresh each check
  // so the window naturally slides forward day by day) are reachable — keeps people from
  // wandering off into distant weeks.
  function thisWeekStart(){ return mondayOf(new Date()); }
  function isWeekNavigable(start){
    const min = addDays(thisWeekStart(), -7);
    const max = addDays(thisWeekStart(), 7);
    return start.getTime() >= min.getTime() && start.getTime() <= max.getTime();
  }
  function updateWeekNavButtons(){
    document.getElementById("prevWeek").disabled = !isWeekNavigable(addDays(weekStart, -7));
    document.getElementById("nextWeek").disabled = !isWeekNavigable(addDays(weekStart, 7));
  }

  async function goToWeek(newStart){
    if(!isWeekNavigable(newStart)) return; // outside the allowed 3-week window — ignore
    weekStart = newStart;
    render(); // show immediately with whatever we already have
    updateWeekNavButtons();
    const key = iso(weekStart);
    if(ghConfig && !loadedFromGithubWeeks.has(key)){
      setBannerState("loading");
      const found = await loadWeekFromGithub(key);
      if(found) render(); // refresh with the data pulled from GitHub
      setBannerState("connected");
    } else if(ghConfig){
      setBannerState("connected");
    }
  }
  document.getElementById("prevWeek").addEventListener("click", ()=> goToWeek(addDays(weekStart,-7)));
  document.getElementById("nextWeek").addEventListener("click", ()=> goToWeek(addDays(weekStart,7)));
  document.getElementById("gotoToday").addEventListener("click", ()=> goToWeek(mondayOf(new Date())));
  updateWeekNavButtons();

  document.getElementById("addRowBtn").addEventListener("click", ()=>{
    const label = prompt("새 행 이름을 입력하세요 (예: 유치원, 행정실 등)");
    if(label && label.trim()){
      categories.push({id: uid(), label: label.trim()});
      render();
    }
  });

  document.getElementById("printBtn").addEventListener("click", ()=> window.print());

  // Register the service worker — Chrome/Android will not offer "Add to Home Screen"
  // (won't fire beforeinstallprompt) without one, even if the manifest/icons are fine.
  // Requires HTTPS (or localhost) and a real same-origin file, so this silently does
  // nothing when opened as a local file:// — that's expected, not an error.
  if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").catch(err=> console.warn("서비스 워커 등록 실패:", err));
  }

  // ---------- "홈 화면에 추가" (Add to Home Screen) ----------
  // Android/Chrome supports a native one-tap install prompt (beforeinstallprompt). iOS Safari
  // has no such API — Apple only allows this via the manual Share-sheet flow — so there we just
  // show instructions instead of a broken button.
  const installBtn = document.getElementById("installBtn");
  let deferredInstallPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS 13+
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandalone) installBtn.style.display = "";
  });

  if(isIOS && !isStandalone){
    installBtn.style.display = "";
  }

  installBtn.addEventListener("click", async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = "none";
    }else if(isIOS){
      alert("아이폰/아이패드에서는 자동 설치 버튼이 없어요. 아래 순서로 추가해주세요:\n\n1. 화면 하단(또는 상단)의 공유 버튼(네모에 화살표 ↑)을 누르세요\n2. 아래로 스크롤해서 '홈 화면에 추가'를 선택하세요\n3. '추가'를 누르면 완료됩니다");
    }else{
      alert("이 브라우저에서는 자동 설치가 지원되지 않을 수 있습니다. 브라우저 메뉴에서 '홈 화면에 추가' 또는 '앱 설치'를 찾아보세요.");
    }
  });

  window.addEventListener("appinstalled", ()=>{
    installBtn.style.display = "none";
  });


  // ---------- PDF export (내보내기) ----------
  function pdfFilename(){
    const dates = weekDates(weekStart);
    const s = dates[0], e = dates[6];
    const range = `${s.getMonth()+1}. ${s.getDate()}.~${e.getMonth()+1}. ${e.getDate()}.`;
    let org = document.getElementById("schoolName").textContent
      .replace(/\s*주간\s*일정표\s*$/,"")
      .trim()
      .replace(/-/g, ",");
    return `${org} 주간일정표(${range}).pdf`;
  }

  const pdfSpinner = document.getElementById("pdfSpinner");

  document.getElementById("exportBtn").addEventListener("click", async ()=>{
    if(typeof html2canvas === "undefined" || !window.jspdf){
      alert("PDF 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도하거나 '인쇄' 버튼으로 PDF 저장을 이용해주세요.");
      return;
    }
    pdfSpinner.classList.add("show");
    document.body.classList.add("pdf-capture");
    await new Promise(r=> setTimeout(r, 30)); // let layout settle before capture
    try{
      const target = document.querySelector(".sheet");
      const canvas = await html2canvas(target, {scale:2, backgroundColor:"#fbfaf7"});
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation:"landscape", unit:"pt", format:"a4"});
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 24;
      let w = pageW - margin*2;
      let h = canvas.height * w / canvas.width;
      if(h > pageH - margin*2){
        h = pageH - margin*2;
        w = canvas.width * h / canvas.height;
      }
      const x = (pageW - w)/2;
      const y = (pageH - h)/2;
      pdf.addImage(imgData, "PNG", x, y, w, h);
      pdf.save(pdfFilename());
    }catch(err){
      console.error(err);
      alert("PDF를 만드는 중 문제가 발생했습니다. '인쇄' 버튼을 눌러 브라우저의 인쇄 기능으로 PDF 저장을 시도해보세요.");
    }finally{
      document.body.classList.remove("pdf-capture");
      pdfSpinner.classList.remove("show");
    }
  });

  // ---------- HWPX export (내보내기(HWPX)) ----------
  // Builds a real, valid .hwpx (OWPML) file entirely client-side, reusing the style/font
  // definitions (Contents/header.xml) and package boilerplate from a real Hangul-saved
  // template so the result opens correctly in 한글 — only Contents/section0.xml (the
  // actual page content) is generated fresh from the currently displayed week.

  function xmlEscape(s){
    return String(s==null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Weekday header cell fill: grey for weekdays, red for Sunday, blue for Saturday —
  // reuses the exact borderFill IDs (with matching colors) already defined in header.xml.
  function hwpxHeaderBorderFor(dayIndex){
    if(dayIndex===5) return 8; // Saturday — blue
    if(dayIndex===6) return 7; // Sunday — red
    return 6;                  // Mon–Fri — grey
  }

  function hwpxParaSimple(paraPrIDRef, charPrIDRef, text, width){
    return `<hp:p id="0" paraPrIDRef="${paraPrIDRef}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${charPrIDRef}"><hp:t>${xmlEscape(text)}</hp:t></hp:run><hp:linesegarray><hp:lineseg textpos="0" vertpos="0" vertsize="1000" textheight="1000" baseline="850" spacing="400" horzpos="0" horzsize="${width}" flags="393216"/></hp:linesegarray></hp:p>`;
  }

  // A cell can hold several schedule entries; each becomes one or two paragraphs
  // (time+title bold, location as a smaller regular line underneath).
  function hwpxEntryParas(entries, width){
    if(!entries || entries.length===0){
      return `<hp:p id="0" paraPrIDRef="21" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="21"/><hp:linesegarray><hp:lineseg textpos="0" vertpos="0" vertsize="900" textheight="900" baseline="765" spacing="360" horzpos="0" horzsize="${width}" flags="393216"/></hp:linesegarray></hp:p>`;
    }
    let out = "";
    entries.forEach(ent=>{
      const line1 = ent.time ? `${ent.time} ${ent.title||""}` : (ent.title||"");
      out += `<hp:p id="0" paraPrIDRef="21" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="20"><hp:t>${xmlEscape(line1)}</hp:t></hp:run><hp:linesegarray><hp:lineseg textpos="0" vertpos="0" vertsize="900" textheight="900" baseline="765" spacing="180" horzpos="0" horzsize="${width}" flags="393216"/></hp:linesegarray></hp:p>`;
      if(ent.loc){
        out += `<hp:p id="0" paraPrIDRef="21" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="21"><hp:t>    - ${xmlEscape(ent.loc)}</hp:t></hp:run><hp:linesegarray><hp:lineseg textpos="0" vertpos="0" vertsize="900" textheight="900" baseline="765" spacing="360" horzpos="0" horzsize="${width}" flags="393216"/></hp:linesegarray></hp:p>`;
      }
    });
    return out;
  }

  function hwpxCell(borderFillIDRef, paras, colAddr, rowAddr, width, height, vertAlign){
    return `<hp:tc name="" header="0" hasMargin="1" protect="0" editable="0" dirty="0" borderFillIDRef="${borderFillIDRef}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${vertAlign||'CENTER'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList><hp:cellAddr colAddr="${colAddr}" rowAddr="${rowAddr}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${width}" height="${height}"/><hp:cellMargin left="510" right="510" top="283" bottom="283"/></hp:tc>`;
  }

  // A4 landscape (the original template's page was A4 portrait — width/height swapped here so
  // the wide 8-column table fits one sheet), with tighter margins to maximize usable space.
  const HWPX_PAGE_W = 84188, HWPX_PAGE_H = 59528, HWPX_MARGIN = 2600;
  const HWPX_SECPR_LANDSCAPE = HWPX_SECPR_BLOCK.replace(
    '<hp:pagePr landscape="NARROWLY" width="59528" height="84188" gutterType="LEFT_ONLY"><hp:margin header="0" footer="0" gutter="0" left="2834" right="2834" top="4251" bottom="2834"/></hp:pagePr>',
    `<hp:pagePr landscape="WIDELY" width="${HWPX_PAGE_W}" height="${HWPX_PAGE_H}" gutterType="LEFT_ONLY"><hp:margin header="0" footer="0" gutter="0" left="${HWPX_MARGIN}" right="${HWPX_MARGIN}" top="${HWPX_MARGIN}" bottom="${HWPX_MARGIN}"/></hp:pagePr>`
  );

  // Builds the whole <hp:tbl>...</hp:tbl> for the week currently on screen, sized to fit a
  // single A4 landscape sheet: row heights are computed from content, then scaled down together
  // (with a readable floor) if the natural total would run past one page.
  function buildHwpxScheduleTable(titleBlockHeight){
    const dates = weekDates(weekStart);
    const key = iso(weekStart);
    const printableWidth = HWPX_PAGE_W - HWPX_MARGIN*2;   // ~78988
    const printableHeight = HWPX_PAGE_H - HWPX_MARGIN*2 - titleBlockHeight; // budget left for the table

    const LABEL_W = 8500, WEEKDAY_W = 10800, WEEKEND_W = 8000;
    const rawColWidths = [LABEL_W, WEEKDAY_W,WEEKDAY_W,WEEKDAY_W,WEEKDAY_W,WEEKDAY_W, WEEKEND_W,WEEKEND_W];
    const rawColTotal = rawColWidths.reduce((a,b)=>a+b,0);
    const colScale = printableWidth / rawColTotal; // stretch/shrink columns to exactly fill the page width
    const colWidths = rawColWidths.map(w=> Math.round(w*colScale));

    const headerH = 1700;
    const rowCnt = 1 + categories.length;
    const colCnt = 8;

    // natural (unscaled) height each category row would want, based on how much text it holds
    function naturalRowHeight(cat){
      const dayEntries = entries[key] && entries[key][cat.id] ? entries[key][cat.id] : {};
      let maxLines = 1;
      for(let d=0; d<7; d++){
        const list = dayEntries[d] || [];
        let lines = 0;
        list.forEach(e=>{ lines += e.loc ? 2 : 1; });
        maxLines = Math.max(maxLines, lines);
      }
      return Math.max(3200, 1400 + maxLines*1350);
    }
    const naturalHeights = categories.map(naturalRowHeight);
    const naturalBodyTotal = naturalHeights.reduce((a,b)=>a+b,0);
    const MIN_ROW_H = 2100;
    const available = Math.max(0, printableHeight - headerH);
    let rowScale = 1;
    if(naturalBodyTotal > available && naturalBodyTotal > 0){
      rowScale = Math.max(available / naturalBodyTotal, (MIN_ROW_H*categories.length) / naturalBodyTotal, 0.001);
    }
    const rowHeights = naturalHeights.map(h=> Math.max(MIN_ROW_H, Math.round(h*rowScale)));

    let rows = "";

    // header row: 구분 + 월..일 (day + date combined, e.g. "월 8/31")
    let headerCells = hwpxCell(13, hwpxParaSimple(3, 19, "구분", colWidths[0]), 0, 0, colWidths[0], headerH, "CENTER");
    dates.forEach((d,i)=>{
      const label = `${DOW[i]} ${d.getMonth()+1}/${d.getDate()}`;
      headerCells += hwpxCell(hwpxHeaderBorderFor(i), hwpxParaSimple(4, 9, label, colWidths[i+1]), i+1, 0, colWidths[i+1], headerH, "CENTER");
    });
    rows += `<hp:tr>${headerCells}</hp:tr>`;

    // one row per category
    categories.forEach((cat, rIdx)=>{
      const rowAddr = rIdx + 1;
      const rowH = rowHeights[rIdx];
      const dayEntries = entries[key] && entries[key][cat.id] ? entries[key][cat.id] : {};

      let rowCells = hwpxCell(12, hwpxParaSimple(3, 19, cat.label, colWidths[0]), 0, rowAddr, colWidths[0], rowH, "CENTER");
      for(let d=0; d<7; d++){
        const list = sortByTime(dayEntries[d] || []);
        rowCells += hwpxCell(4, hwpxEntryParas(list, colWidths[d+1]), d+1, rowAddr, colWidths[d+1], rowH, "TOP");
      }
      rows += `<hp:tr>${rowCells}</hp:tr>`;
    });

    const totalWidth = colWidths.reduce((a,b)=>a+b,0);
    const totalHeight = headerH + rowHeights.reduce((a,b)=>a+b,0);

    return `<hp:tbl id="${Math.floor(Math.random()*1000000000)}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${rowCnt}" colCnt="${colCnt}" cellSpacing="0" borderFillIDRef="4" noAdjust="1"><hp:sz width="${totalWidth}" widthRelTo="ABSOLUTE" height="${totalHeight}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="141" bottom="141"/>${rows}</hp:tbl>`;
  }

  function buildHwpxSection0(){
    const titleText = document.getElementById("schoolName").textContent.trim();
    const titleBlockHeight = 3200; // reserve space for the title paragraph above the table
    const titlePara = `<hp:p id="0" paraPrIDRef="3" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="16"><hp:t>${xmlEscape(titleText)}</hp:t></hp:run><hp:linesegarray><hp:lineseg textpos="0" vertpos="0" vertsize="1900" textheight="1900" baseline="1615" spacing="1200" horzpos="0" horzsize="78988" flags="393216"/></hp:linesegarray></hp:p>`;
    const table = buildHwpxScheduleTable(titleBlockHeight);

  const hwpxSpinner = document.getElementById("pdfSpinner"); // reuse the same overlay/spinner as PDF export

      const cleanHeaderXml = HWPX_HEADER_XML

  // ---------- modal editor ----------
  const backdrop = document.getElementById("backdrop");
  const entryList = document.getElementById("entryList");
  const modalTitle = document.getElementById("modalTitle");
  const modalSub = document.getElementById("modalSub");

  function openEditor(weekKey, catId, dayIndex, catLabel, date){
    editing = {weekKey, catId, dayIndex};
    // sort by time up front so the editor always opens showing the same time order as the table
    // (covers entries that arrived out of order via the "공통 일정" group-sync, imports, etc.)
    entries[weekKey][catId][dayIndex] = sortByTime(entries[weekKey][catId][dayIndex]);

  function currentEntries(){
    const {weekKey, catId, dayIndex} = editing;
    return entries[weekKey][catId][dayIndex];
  }

  // ---------- shared entries: apply one entry to multiple rows (교육장/교육지원국장/행정지원국장 등) ----------
  function findGroupEntry(weekKey, catId, dayIndex, groupId){
    return entries[weekKey][catId][dayIndex].find(e=> e.groupId===groupId);
  }
  function groupMemberCatIds(weekKey, dayIndex, groupId){
    return categories.filter(c=> !!findGroupEntry(weekKey, c.id, dayIndex, groupId)).map(c=>c.id);
  }
  function propagateGroupContent(weekKey, dayIndex, groupId, originCatId, data){
    categories.forEach(cat=>{
      if(cat.id===originCatId) return;
      const e = findGroupEntry(weekKey, cat.id, dayIndex, groupId);
      if(e){ e.time = data.time; e.title = data.title; e.loc = data.loc; }
    });
  }
  function toggleGroupMember(weekKey, dayIndex, groupId, catId, on, data){
    const arr = entries[weekKey][catId][dayIndex];
    const idx = arr.findIndex(e=> e.groupId===groupId);
    if(on && idx<0){
      arr.push({id:uid(), groupId, time:data.time, title:data.title, loc:data.loc});
    } else if(!on && idx>=0){
      arr.splice(idx,1);
    }
  }
  function removeGroupEverywhere(weekKey, dayIndex, groupId){
    categories.forEach(cat=>{
      const arr = entries[weekKey][cat.id][dayIndex];
      const idx = arr.findIndex(e=> e.groupId===groupId);
      if(idx>=0) arr.splice(idx,1);
    });
  }

  function renderEntryList(){
    const list = currentEntries();

        if(others.length>0){

          if(!confirm(`이 일정은 ${names}에도 함께 적용되어 있습니다. 모두 삭제할까요?`)) return;

      const row1 = document.createElement("div");

      row1.innerHTML = `

      row2.querySelector(".loc-fld").addEventListener("input", e=>{ ent.loc = e.target.value; liveSave(); });

      // "적용 대상" — apply the same entry to other rows (e.g. 교육장/교육지원국장/행정지원국장)
      if(categories.length>1){

          cb.type = "checkbox";

          cb.addEventListener("change", ()=>{
            toggleGroupMember(editing.weekKey, editing.dayIndex, ent.groupId, cat.id, cb.checked, {time:ent.time, title:ent.title, loc:ent.loc});

          chip.appendChild(cb);
          chip.appendChild(document.createTextNode(cat.label));

  function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

  // ---- live save: updates the underlying table immediately, no save button needed ----
  const saveIndicator = document.getElementById("saveIndicator");
  let saveTimer = null;
  let indicatorTimer = null;
  function liveSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      if(editing){
        currentEntries().forEach(ent=>{
          if(!ent.groupId) ent.groupId = ent.id;
          propagateGroupContent(editing.weekKey, editing.dayIndex, ent.groupId, editing.catId, {time:ent.time, title:ent.title, loc:ent.loc});

  function closeModal(){
    // normalize any time left unblurred, drop fully-empty entries (and their shared copies), then sort by time
    const raw = currentEntries().map(e=> ({...e, time: normalizeTime(e.time), groupId: e.groupId || e.id}));
    const kept = [];
    raw.forEach(e=>{
      const hasContent = (e.title && e.title.trim()) || (e.time && e.time.trim()) || (e.loc && e.loc.trim());
      if(hasContent) kept.push(e);
      else removeGroupEverywhere(editing.weekKey, editing.dayIndex, e.groupId);
    });
    const savedWeekKey = editing.weekKey, savedDayIndex = editing.dayIndex;
    entries[editing.weekKey][editing.catId][editing.dayIndex] = sortByTime(kept);
    // also re-sort any other rows that received a copy of these entries via "공통 일정" (shared entries),
    // so every affected cell — not just the one just edited — stays in time order
    categories.forEach(cat=>{
      if(cat.id===editing.catId) return;
      entries[savedWeekKey][cat.id][savedDayIndex] = sortByTime(entries[savedWeekKey][cat.id][savedDayIndex]);
    });
    backdrop.classList.remove("open");
    editing = null;
    render();
    saveWeekToGithub(savedWeekKey); // push to GitHub if connected (fire-and-forget)
  }
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  // Only close when BOTH the mousedown and the click landed on the backdrop itself —
  // dragging to select text inside the modal can end (mouseup) just outside the modal box,
  // which would otherwise register as a click on the backdrop and close the modal mid-drag.
  let backdropMouseDownOnSelf = false;
  backdrop.addEventListener("mousedown", (e)=>{ backdropMouseDownOnSelf = (e.target===backdrop); });
  backdrop.addEventListener("click", (e)=>{
    if(e.target===backdrop && backdropMouseDownOnSelf) closeModal();
    backdropMouseDownOnSelf = false;

  // ---------- GitHub: push the week's JSON straight into a repo via the Contents API ----------
  let ghConfig = null; // {owner, repo, branch, path, token} — kept in memory only, never persisted
  let editUnlocked = false; // "일정표 접속" is read-only; editing requires the separate edit password

  // Decrypts a token produced by encrypt.html. Wrong passphrase makes AES-GCM's
  // authentication check fail, so decryptToken() rejects cleanly rather than returning garbage.
  function b64ToBuf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
  async function deriveKey(passphrase, saltBytes){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passphrase), {name:"PBKDF2"}, false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      {name:"PBKDF2", salt: saltBytes, iterations: 150000, hash:"SHA-256"},
      keyMaterial, {name:"AES-GCM", length:256}, false, ["decrypt"]
    );
  }
  async function decryptToken(encObj, passphrase){
    const key = await deriveKey(passphrase, b64ToBuf(encObj.salt));
    const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64ToBuf(encObj.iv)}, key, b64ToBuf(encObj.data));
    return new TextDecoder().decode(plainBuf);
  }

  function setGhStatus(){
    // status text next to the toolbar buttons was removed — the banner communicates
    // connection state instead. Kept as a no-op so any remaining call sites are harmless.
  }

  function setBannerState(mode){
    // mode: 'demo' | 'loading' | 'connected'
    const el = document.getElementById("dataSourceBanner");
    if(mode==="connected"){
      el.classList.add("connected");
      el.innerHTML = `일정표에 접속되었습니다 <button class="btn small primary" id="bannerConnectBtn">일정표 해제</button>`;
      document.getElementById("bannerConnectBtn").addEventListener("click", ()=> document.getElementById("releaseBtn").click());
    } else if(mode==="loading"){
      el.classList.remove("connected");
      el.textContent = "접속하는 중…";
    } else {
      el.classList.remove("connected");
      el.innerHTML = `일정표에 접속되지 않았습니다 <button class="btn small primary" id="bannerConnectBtn">일정표 접속</button>`;
      document.getElementById("bannerConnectBtn").addEventListener("click", ()=> document.getElementById("accessBtn").click());

  function utf8ToBase64(str){
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    bytes.forEach(b=> binary += String.fromCharCode(b));
    return btoa(binary);
  }
  function base64ToUtf8(b64){
    const binary = atob(b64.replace(/\n/g, ""));
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // Weeks we've already pulled from GitHub in this session — avoids re-fetching (and possibly
  // clobbering unsaved edits) every time the same week is revisited.
  const loadedFromGithubWeeks = new Set();

  async function loadWeekFromGithub(weekKey){
    if(!ghConfig) return false;
    const filePath = `${ghConfig.path}/${weekKey}.json`;
    const api = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${filePath}`;
    const headers = {
      "Authorization": `token ${ghConfig.token}`,
      "Accept": "application/vnd.github+json"
    };
    const res = await fetch(`${api}?ref=${encodeURIComponent(ghConfig.branch)}`, {headers, cache:"no-store"});
    loadedFromGithubWeeks.add(weekKey);
    if(res.status===401 || res.status===403){
      // Invalid/expired token, or a leftover dummy value from before EDIT_AUTO_CONFIG held a
      // real token — surface this clearly instead of silently looking "connected" with no data.
      const err = new Error(`인증 실패 (${res.status})`);
      err.isAuthError = true;
      throw err;
    }
    if(res.status===404) return false; // nothing saved for this week yet — keep what's already showing
    if(!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
    const data = await res.json();
    const payload = JSON.parse(base64ToUtf8(data.content));
    // Guard against a corrupted/older save where categories was saved as an empty array —
    // "[]" is truthy in JS, so a naive `if(payload.categories)` check would still wipe out
    // the default rows. Only adopt the loaded categories if they actually contain rows.
    let categoriesWereEmpty = false;
    let categoriesWereStale = false;
    if(payload.categories && payload.categories.length > 0){
      // Locked rows (교육장 etc.) always take their name/definition from the current code —
      // an older save shouldn't be able to silently resurrect a since-renamed label. Only
      // custom (non-locked) rows are trusted as-is from the saved file.
      const customFromSave = payload.categories.filter(c=>!c.locked);
      const mergedLocked = DEFAULT_LOCKED_CATEGORIES.map(def=>{
        const saved = payload.categories.find(c=>c.id===def.id);
        return saved && saved.label !== def.label ? (categoriesWereStale=true, {...def}) : (saved ? {...saved} : {...def});
      });
      categories = [...mergedLocked, ...customFromSave];
    } else if(payload.categories){
      categoriesWereEmpty = true; // present but empty — keep current defaults, and heal the file below
    }
    if(payload.entries && payload.entries[weekKey]) entries[weekKey] = payload.entries[weekKey];
    if(categoriesWereEmpty || categoriesWereStale){
      if(categoriesWereEmpty) console.warn(`data/${weekKey}.json had an empty categories list — keeping the default rows and re-saving to fix the file.`);
      if(categoriesWereStale) console.warn(`data/${weekKey}.json had an outdated label for a locked row — using the current code's label and re-saving to fix the file.`);
      saveWeekToGithub(weekKey); // self-heal: re-commit with the correct categories
    }
    return true;
  }

  // ---------- "이 브라우저에 저장" (remember on this device) ----------
  // Only meaningful when this file is opened directly in your own browser (not previewed inside
  // Claude's chat window, where browser storage is sandboxed and won't persist).
  const GH_REMEMBER_KEY = "weekly-schedule-gh-config-v1";
  function rememberGhConfig(cfg){
    try{ localStorage.setItem(GH_REMEMBER_KEY, JSON.stringify(cfg)); }catch(e){ console.warn("이 브라우저에 저장하지 못했습니다:", e); }
  }
  function forgetGhConfig(){
    try{ localStorage.removeItem(GH_REMEMBER_KEY); }catch(e){}
  }
  function loadRememberedGhConfig(){
    try{
      const raw = localStorage.getItem(GH_REMEMBER_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function setAccessButtonsState(connected){
    document.getElementById("accessBtn").style.display = connected ? "none" : "";
    document.getElementById("releaseBtn").style.display = connected ? "" : "none";
  }

  function setEditButtonsState(unlocked){
    editUnlocked = unlocked;
    document.getElementById("editModeBtn").style.display = unlocked ? "none" : "";
    document.getElementById("lockModeBtn").style.display = unlocked ? "" : "none";
    document.getElementById("addRowBtn").style.display = unlocked ? "" : "none";
    document.getElementById("importBtn").style.display = unlocked ? "" : "none";
    document.getElementById("schoolName").contentEditable = unlocked ? "true" : "false";
    document.body.classList.toggle("read-only", !unlocked);
    render(); // row-labels/day-cells need to re-render with the new edit affordances shown or hidden
  }

  // Decrypting EDIT_AUTO_CONFIG.enc with the edit password yields a real GitHub token — this lets
  // "편집하기" connect AND unlock editing in a single step, without going through "일정표 접속" first.
  async function attemptEditUnlock(password, remember){
    if(!EDIT_AUTO_CONFIG.enc || !EDIT_AUTO_CONFIG.enc.data){
      alert("관리자가 아직 편집 비밀번호를 설정하지 않았습니다.");
      return false;
    }
    try{
      const token = await decryptToken(EDIT_AUTO_CONFIG.enc, password);
      const cfg = { owner: GH_AUTO_CONFIG.owner, repo: GH_AUTO_CONFIG.repo, branch: GH_AUTO_CONFIG.branch, path: GH_AUTO_CONFIG.path, token };
      const ok = await connectWithConfig(cfg); // connectWithConfig already reverts state + explains if this fails
      if(!ok) return false;
      if(remember) rememberGhConfig({...cfg, editUnlocked:true});
      setEditButtonsState(true);
      return true;
    }catch(err){
      return false;
    }
  }

  const editBackdrop = document.getElementById("editBackdrop");
  document.getElementById("editModeBtn").addEventListener("click", ()=>{
    editBackdrop.classList.add("open");
    setTimeout(()=> document.getElementById("editPass").focus(), 50);
  });
  document.getElementById("lockModeBtn").addEventListener("click", ()=>{
    setEditButtonsState(false);
  });
  async function submitEditUnlock(){
    const passInput = document.getElementById("editPass");
    const pass = passInput.value;
    if(!pass) return;
    const remember = document.getElementById("editRemember").checked;
    const ok = await attemptEditUnlock(pass, remember);
    if(ok){
      editBackdrop.classList.remove("open");
      passInput.value = "";
    }else{
      alert("비밀번호가 올바르지 않습니다. 다시 시도해주세요.");
      passInput.value = "";
      passInput.focus();
    }
  }
  document.getElementById("editPassGoBtn").addEventListener("click", submitEditUnlock);
  document.getElementById("editPass").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitEditUnlock(); });
  document.getElementById("editPassSkipBtn").addEventListener("click", ()=> editBackdrop.classList.remove("open"));
  let editBackdropMouseDownOnSelf = false;
  editBackdrop.addEventListener("mousedown", (e)=>{ editBackdropMouseDownOnSelf = (e.target===editBackdrop); });
  editBackdrop.addEventListener("click", (e)=>{
    if(e.target===editBackdrop && editBackdropMouseDownOnSelf) editBackdrop.classList.remove("open");
    editBackdropMouseDownOnSelf = false;
  });

  document.getElementById("releaseBtn").addEventListener("click", ()=>{
    if(!confirm("일정표 연결을 해제할까요? 화면의 일정 내용도 함께 사라지고, 이 브라우저에 저장된 접속 정보도 지워집니다.")) return;
    forgetGhConfig();
    ghConfig = null;
    entries = {};                 // clear loaded data from view — nothing stays visible once disconnected
    loadedFromGithubWeeks.clear();
    ensureWeek(iso(weekStart));
    setAccessButtonsState(false);
    setEditButtonsState(false);
    setBannerState("demo");
    render();
  });

  // Saves for the same week must run one-at-a-time; overlapping saves cause a "sha does not match"
  // conflict on GitHub's side (a stale version number sent alongside a request that arrives second).
  let ghSaveQueue = Promise.resolve();

  function saveWeekToGithub(weekKey){
    ghSaveQueue = ghSaveQueue
      .then(()=> doSaveWeekToGithub(weekKey))
      .catch(err=> console.error(err)); // keep the queue alive even if one save fails
    return ghSaveQueue;
  }

  async function putWeekFile(api, headers, weekKey, json, attempt){
    let sha = null;
    const getRes = await fetch(`${api}?ref=${encodeURIComponent(ghConfig.branch)}`, {headers, cache:"no-store"});
    if(getRes.status===200){
      sha = (await getRes.json()).sha;
    } else if(getRes.status!==404){
      throw new Error(`파일 조회 실패 (${getRes.status})`);
    }
    const body = {
      message: `주간일정표 저장: ${weekKey}`,
      content: utf8ToBase64(json),
      branch: ghConfig.branch
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(api, {
      method: "PUT",
      headers: {...headers, "Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    if(putRes.status===409 && attempt<2){
      // stale sha (a concurrent save landed first) — refetch the latest version and try once more
      return putWeekFile(api, headers, weekKey, json, attempt+1);
    }
    if(!putRes.ok){
      const errBody = await putRes.json().catch(()=>({}));
      throw new Error(errBody.message || `저장 실패 (${putRes.status})`);
    }
  }

  async function doSaveWeekToGithub(weekKey){
    if(!ghConfig) return;
    const payload = {weekStart: weekKey, categories, entries: {[weekKey]: entries[weekKey]}};
    const json = JSON.stringify(payload, null, 2);
    const filePath = `${ghConfig.path}/${weekKey}.json`;
    const api = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${filePath}`;
    const headers = {
      "Authorization": `token ${ghConfig.token}`,
      "Accept": "application/vnd.github+json"
    };
    try{
      await putWeekFile(api, headers, weekKey, json, 0);
    }catch(err){
      console.error(err);
    }
  }

  // Sample data is intentionally not pre-loaded — until "일정표 접속" succeeds, every cell stays
  // empty rather than showing placeholder content that could be mistaken for real data.
  ensureWeek(iso(weekStart));

  render();
  setBannerState("demo"); // wires up the banner's "일정표 접속" button and shows the demo-data notice
  setAccessButtonsState(false);
  setEditButtonsState(false);

  // ---------- Connect + load a week's data, then update all the status UI ----------
  // Always starts read-only; callers that want editing unlocked (attemptEditUnlock) flip it
  // back on right after this resolves. Returns true on success, false if the token turned out
  // to be invalid (wrong/leftover token) — callers should undo the "connected" UI in that case.
  async function connectWithConfig(cfg){
    ghConfig = cfg;
    setAccessButtonsState(true);
    setEditButtonsState(false);
    setBannerState("loading");
    const key = iso(weekStart);
    try{
      await loadWeekFromGithub(key);
      render();
      setBannerState("connected");
      return true;
    }catch(err){
      console.error(err);
      ghConfig = null;
      entries = {};
      loadedFromGithubWeeks.clear();
      ensureWeek(key);
      setAccessButtonsState(false);
      setBannerState("demo");
      render();
      if(err.isAuthError){
        alert("접속 정보가 올바르지 않습니다. 토큰이 잘못되었거나 만료되었을 수 있어요 — 관리자에게 문의해주세요.");
      }else{
        alert("데이터를 불러오는 중 문제가 발생했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.");
      }
      return false;
    }
  }

  async function runAutoConnect(passphrase, remember){
    if(!GH_AUTO_CONFIG.enc || !GH_AUTO_CONFIG.enc.data){
      alert("관리자가 아직 일정표 접속을 설정하지 않았습니다.");
      return false;
    }
    try{
      const token = await decryptToken(GH_AUTO_CONFIG.enc, passphrase);
      const cfg = { owner: GH_AUTO_CONFIG.owner, repo: GH_AUTO_CONFIG.repo, branch: GH_AUTO_CONFIG.branch, path: GH_AUTO_CONFIG.path, token };
      const ok = await connectWithConfig(cfg); // connectWithConfig already reverts state + explains if this fails
      if(!ok) return false;
      if(remember) rememberGhConfig(cfg);
      return true;
    }catch(err){
      console.error(err);
      return false;
    }
  }

  const passBackdrop = document.getElementById("passBackdrop");
  function openAccessModal(){
    passBackdrop.classList.add("open");
    setTimeout(()=> document.getElementById("autoConnectPass").focus(), 50);
  }

  document.getElementById("accessBtn").addEventListener("click", openAccessModal);

  async function submitAutoConnect(){
    const passInput = document.getElementById("autoConnectPass");
    const pass = passInput.value;
    if(!pass) return;
    const remember = document.getElementById("autoConnectRemember").checked;
    const ok = await runAutoConnect(pass, remember);
    if(ok){
      passBackdrop.classList.remove("open");
      passInput.value = "";
    }else{
      alert("암호가 올바르지 않거나 복호화에 실패했습니다. 다시 시도해주세요.");
      passInput.value = "";
      passInput.focus();
    }
  }
  document.getElementById("autoConnectGoBtn").addEventListener("click", submitAutoConnect);
  document.getElementById("autoConnectPass").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitAutoConnect(); });
  document.getElementById("autoConnectSkipBtn").addEventListener("click", ()=>{
    passBackdrop.classList.remove("open");
  });
  let passBackdropMouseDownOnSelf = false;
  passBackdrop.addEventListener("mousedown", (e)=>{ passBackdropMouseDownOnSelf = (e.target===passBackdrop); });
  passBackdrop.addEventListener("click", (e)=>{
    if(e.target===passBackdrop && passBackdropMouseDownOnSelf) passBackdrop.classList.remove("open");
    passBackdropMouseDownOnSelf = false;
  });

  // ---------- On page load: reconnect automatically if this browser already has a saved connection ----------
  const remembered = loadRememberedGhConfig();
  if(remembered && remembered.owner && remembered.repo && remembered.token){
    connectWithConfig(remembered).then(ok=>{ // zero-friction — no prompt at all
      if(ok && remembered.editUnlocked) setEditButtonsState(true);
      if(!ok) forgetGhConfig(); // stale/invalid saved token — don't keep failing silently on every reload
    });
  } else if(GH_AUTO_CONFIG.enc && GH_AUTO_CONFIG.enc.data){
    openAccessModal(); // admin has set up an access password — ask for it
  }
})();
</script>
</body>
</html>
